name: Browser updater

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/build_web.py'
      - 'scripts/test_build_web.py'
      - 'scripts/ota_upload.py'
      - 'scripts/release_assets.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  release:
    types: [published]
  # Releases published with GITHUB_TOKEN do not emit another workflow's release
  # event. Rebuild after the trusted OTA workflow publishes its checked assets.
  workflow_run:
    workflows: ['OTA release']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Never execute code or consume artifacts from the triggering run.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test browser updater and release validation
        run: |
          node --test web/*.test.mjs
          python3 scripts/test_build_web.py
      - name: Stage updater with latest checked compatible release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_web.py --repository "$GITHUB_REPOSITORY" --output build/web
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish updater
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
